## Remote Profile Configuration
## On a local start of the remote application the .env file is loaded if
## present (development convenience). On remote/CI starts the .env file does
## not exist, so the values come from the real environment variables
## (CI secret variables).
spring.config.import=optional:file:.env[.properties]
## The remote profile loads its mock data exclusively from the Supabase S3
## bucket (see RemoteBootstrap). The Supabase S3 settings live in
## application.properties.
