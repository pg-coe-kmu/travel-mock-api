## Spring Boot Application Configuration
spring.application.name=travel-mock-api
## Active Profile (set via Maven property `activatedProfile`: remote by default, local with -Plocal)
spring.profiles.active=@activatedProfile@
## Supabase S3 (S3-compatible storage API, used by the S3Reader)
## The values come from the .env file in the local profile (see
## application-local.properties) or from real environment variables in the
## remote profile (e.g. the CI secret variables).
## The secrets are only read inside S3Config - they are never exposed here
## or via EnvConfig.
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:}
supabase.s3.region=${SUPABASE_S3_REGION:eu-central-1}
supabase.s3.accessKey=${SUPABASE_S3_ACCESS_KEY:}
supabase.s3.secretKey=${SUPABASE_S3_SECRET_KEY:}
supabase.s3.bucket=${SUPABASE_BUCKET:}
supabase.s3.folder=${SUPABASE_FOLDER:data}

## Server Configuration
server.port=${PORT:8080}

## Reservation DB (Supabase/PostgreSQL) - schema: db/reservations.sql
## Die DataSource wird in DataSourceConfig gebaut: Host aus SUPABASE_URL
## abgeleitet (db.<project-ref>.supabase.co), User "postgres", Passwort
## aus SUPABASE_DB_PASSWORD (Dashboard -> Project Settings -> Database).
## Ohne gesetzte Werte startet die App trotzdem (Hikari verbindet lazy) -
## die Reservation-Endpoints liefern dann aber 500.
supabase.db.password=${SUPABASE_DB_PASSWORD:}