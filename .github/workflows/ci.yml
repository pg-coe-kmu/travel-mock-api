name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B test
        env:
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
          SUPABASE_S3_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t travel-mock-api .

      - name: Smoke test remote application
        run: |
          docker run -d --name travel-mock-remote \
            -e SUPABASE_S3_ENDPOINT="${{ secrets.SUPABASE_S3_ENDPOINT }}" \
            -e SUPABASE_S3_ACCESS_KEY="${{ secrets.SUPABASE_S3_ACCESS_KEY }}" \
            -e SUPABASE_S3_SECRET_KEY="${{ secrets.SUPABASE_S3_SECRET_KEY }}" \
            -e SUPABASE_BUCKET="${{ secrets.SUPABASE_BUCKET }}" \
            -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            -e SUPABASE_DB_HOST="${{ secrets.SUPABASE_DB_HOST }}" \
            -e SUPABASE_DB_PORT="${{ secrets.SUPABASE_DB_PORT }}" \
            -e SUPABASE_DB_USER="${{ secrets.SUPABASE_DB_USER }}" \
            -e SUPABASE_DB_PASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" \
            travel-mock-api
          for i in $(seq 1 30); do
            if docker logs travel-mock-remote 2>&1 | grep -q "Started TravelMockRemoteApplication"; then
              echo "Remote application started successfully"
              if docker logs travel-mock-remote 2>&1 | grep -q "Catalog-Seeding"; then
                docker stop travel-mock-remote
                exit 0
              fi
              echo "Application started but catalog seeding did not run - full container log:"
              docker logs travel-mock-remote 2>&1
              docker stop travel-mock-remote
              exit 1
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' travel-mock-remote)" != "true" ]; then
              echo "Container exited unexpectedly"
              docker logs travel-mock-remote
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for startup"
          docker logs travel-mock-remote
          docker stop travel-mock-remote
          exit 1
